[package]
name = "bist"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
description = "Bounded Invariant Set Toolbox for dynamical systems with bounded noise"
license = "MIT"
repository = "https://github.com/namvdo/set-valued-viz"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "imperial_core_lab"
test = false

[[example]]
name = "imperial_practice"
test = true

[dependencies]
nalgebra = "0.33.0"
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1.0.221", features = ["derive"] }
evalexpr = "11.3.0"
serde_json = "1.0.144"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

# wasm-pack enables Binaryen by default for release builds. The release build
# remains optimized by rustc above, while disabling this optional post-pass
# keeps clean builds reproducible on machines without a separate wasm-opt tool.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
